name: Build and Release Firmware

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: [self-hosted, manupa-hnx]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Configure Git safe directory
      run: git config --global --add safe.directory '*'

    - name: Cache Arduino cores and packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.arduino15/packages
          ~/.arduino15/staging
        key: arduino-esp32-${{ runner.os }}-${{ hashFiles('ESP32-CAM_MJPEG2SD.ino') }}
        restore-keys: |
          arduino-esp32-${{ runner.os }}-

    - name: Set up arduino-cli
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        ./bin/arduino-cli config init --overwrite
        ./bin/arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        ./bin/arduino-cli core update-index
        if ! ./bin/arduino-cli core list | grep -q 'esp32:esp32'; then
          for i in 1 2 3; do ./bin/arduino-cli core install esp32:esp32 && break || sleep 5; done
        fi

    - name: Install libraries
      run: |
        ./bin/arduino-cli lib install "LittleFS_esp32"

    - name: Compile sketch
      run: |
        ./bin/arduino-cli compile --fqbn esp32:esp32:esp32cam:PartitionScheme=min_spiffs --output-dir build/esp32.esp32.esp32cam ESP32-CAM_MJPEG2SD.ino

    - name: Archive firmware
      uses: actions/upload-artifact@v7
      with:
        name: firmware
        path: |
          build/esp32.esp32.esp32cam/ESP32-CAM_MJPEG2SD.ino.bin
          build/esp32.esp32.esp32cam/ESP32-CAM_MJPEG2SD.ino.partitions.bin
          build/esp32.esp32.esp32cam/bootloader.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, manupa-hnx]
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware
      - name: Stage release assets
        run: |
          cp firmware/ESP32-CAM_MJPEG2SD.ino.bin firmware/firmware.bin
          cp firmware/ESP32-CAM_MJPEG2SD.ino.partitions.bin firmware/partitions.bin
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            firmware/firmware.bin
            firmware/partitions.bin
            firmware/bootloader.bin
