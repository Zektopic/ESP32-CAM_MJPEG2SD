name: Build and Release Firmware

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up arduino-cli
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        ./bin/arduino-cli config init
        ./bin/arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        ./bin/arduino-cli core update-index
        ./bin/arduino-cli core install esp32:esp32

    - name: Install libraries
      run: |
        ./bin/arduino-cli lib install "LittleFS_esp32"

    - name: Compile sketch
      run: |
        ./bin/arduino-cli compile --fqbn esp32:esp32:esp32cam:PSRAM=enabled,PartitionScheme=min_spiffs ESP32-CAM_MJPEG2SD.ino

    - name: Archive firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          build/esp32.esp32.esp32cam/ESP32-CAM_MJPEG2SD.ino.bin
          build/esp32.esp32.esp32cam/ESP32-CAM_MJPEG2SD.ino.partitions.bin
          build/esp32.esp32.esp32cam/bootloader.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload firmware to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: firmware/ESP32-CAM_MJPEG2SD.ino.bin
          asset_name: firmware.bin
          asset_content_type: application/octet-stream
      - name: Upload partitions to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: firmware/ESP32-CAM_MJPEG2SD.ino.partitions.bin
          asset_name: partitions.bin
          asset_content_type: application/octet-stream
      - name: Upload bootloader to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: firmware/bootloader.bin
          asset_name: bootloader.bin
          asset_content_type: application/octet-stream
